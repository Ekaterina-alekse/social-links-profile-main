<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
  <main>
    <article class="card">

      <header class="personal-information">
        <h1 class="visually-hidden">Links to social media profiles</h1>
        <img class="avatar" src="assets/images/avatar-jessica.jpeg" alt="Avatar of Jessica Randall" width="90"
          height="90">
        <span class="name">Jessica Randall</span>
        <span class="location">London, United Kingdom</span>
        <p class="profession">"Front-end developer and avid reader."</p>
      </header>

      <section class="social-list">
        <h2 class="visually-hidden">List of links</h2>
        <ul class="link-list">
          <li class="social"><a class="social-link" href="#">GitHub</a></li>
          <li class="social"><a class="social-link" href="#">Frontend Mentor</a></li>
          <li class="social"><a class="social-link" href="#">LinkedIn</a></li>
          <li class="social"><a class="social-link" href="#">Twitter</a></li>
          <li class="social"><a class="social-link" href="#">Instagram</a></li>
        </ul>
      </section>
    </article>
  </main>
  <footer class="attribution">
    <p> Challenge by <a class="sign" href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        rel="noopener noreferrer">Frontend Mentor</a>.
      Coded by <a class="sign" href="https://github.com/Ekaterina-alekse" target="_blank"
        rel="noopener noreferrer">Kolbina
        Ekaterina</a>.</p>
  </footer>
</body>

</html>
